<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classroom Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --purple: #D1C4E9;
            --green: #4CAF50;
            --red: #F44336;
            --blue: #2196F3;
            --bg: #f0f0f0;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; font-family: sans-serif;
            background: var(--bg); overflow: hidden;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 3fr 1fr;
            grid-template-rows: 1fr 2fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        h2 { text-align: center; margin: 5px 0; font-size: 1.2rem; text-transform: uppercase; color: #555; }

        /* Hallway Checkout - Left 3/4 */
        #hallway {
            grid-row: 1 / span 2;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            flex-grow: 1;
        }

        .group-btn {
            background: var(--purple);
            border: none;
            border-radius: 15px;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .group-btn.active { background: var(--red); color: white; }
        .group-btn span { font-size: 1.2rem; display: block; }

        /* Testing Window - Right Top 1/3 */
        #testing { grid-column: 2; grid-row: 1; }
        #test-indicator {
            flex-grow: 1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        /* Bathroom - Right Bottom 2/3 */
        #bathroom { grid-column: 2; grid-row: 2; gap: 10px; }
        .bath-btn {
            flex-grow: 1;
            border: none;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #girls-btn { background: var(--green); }
        #boys-btn { background: var(--blue); }
        .bath-btn.occupied { background: var(--red) !important; }

        /* Modal / Selection */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            text-align: center;
        }
        .list-item {
            padding: 15px;
            margin: 5px;
            background: #eee;
            border-radius: 8px;
            display: inline-block;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <section id="hallway">
        <h2>Hallway Checkout</h2>
        <div class="grid-container" id="group-grid"></div>
    </section>

    <section id="testing">
        <h2>Testing Window</h2>
        <div id="test-indicator">Checking...</div>
    </section>

    <section id="bathroom">
        <h2>Bathroom</h2>
        <button id="girls-btn" class="bath-btn" onclick="openTeacherSelect('girls')">Girls</button>
        <button id="boys-btn" class="bath-btn" onclick="openTeacherSelect('boys')">Boys</button>
    </section>
</div>

<div id="modal-overlay">
    <div class="modal-content" id="modal-content"></div>
</div>

<script>
    const { jsPDF } = window.jspdf;
    let clickedStudents = new Set();
    let bathroomState = { girls: { active: false, timer: 0, interval: null }, boys: { active: false, timer: 0, interval: null } };

    const students = {
        Kim: ["Advincula,Isabella Sophia", "Agarwal,Nandini", "Badia,Jazeel", "Jones Dorsey Fried,Noa", "Madison Jaiswal,Tiasha", "Kaur,Sifit", "Kelly,Oliver", "Kent Kim,Tyler Christian", "Kinikar,Vibhav", "Koshti,Vivaan Yogeshkumar", "Lasko,Ryder", "Lopez,Logan Alejandro", "Mahato,Ananya", "Maheshwari,Ayra", "Mane,Rudransh Rahul", "Mazur,Patrick Pawel", "Neubauer,Natalie Ann", "Sandeep,Saanvi", "Shin,Chloe", "Singh,Ayan", "Singh,Jasmine", "Timchenko,Jocelyn Elizabeth", "Vijayaraghavan,Avyang", "Youm,Nathan Geon"],
        Levin: ["Akers,Eden Adele", "Costigan,Jemma", "Dashtseren,Anudari", "Goldstein,Chase Louis", "Jhawar,Prerit", "John Alex,Alston Rosario", "Kanishchev,Danylo", "Kosturik,Olivia", "Koziar,Artem", "Mazurenko,Nicole", "Mihina,Matthew Jacob", "Patel,Risha Pradyumn", "Peddareddy,Thoshan Reddy Reddy", "Roganian,Angelica", "Rushka,Aria", "Sahoo,Srishti", "Schulte,Aria Reva", "Sebastian,Ava", "Sherman,Amelia Jane", "Shtilman,Laura Elaine", "Singhdeo,Saatvik", "Siryk,Anna", "Stephen,Arihaan Travis", "Tajimatov,Aidar"],
        Somers: ["Baatar,Michelle", "Cano,Katherine Esther D", "Carlson-Harwell,Yumi Ann", "Chalageri,Diya Ganesh", "Chin,Samuel Lee", "Damodaran,Nikit", "Fleissner,Henry David", "Gupta,Naisha", "Hahn,Katelyn Gia", "Kaliki,Venkata Suchin", "Kott,Zoe Aliyah", "Kurukundhi,Jayendra", "Law,Vivienne Clara", "Nellissery,Austin Paul", "Patil,Aditi Pradeep", "Nethra Roy,Saatvik", "Sharma,Adya K", "Shevchenko,Philip", "Srivastava,Aayansh", "Stern,Kaycie Leigh", "Ulziibaatar,Anand Alex"]
    };

    // Initialize Hallway Buttons
    const grid = document.getElementById('group-grid');
    for (let i = 1; i <= 12; i++) {
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        btn.id = `group-${i}`;
        btn.innerHTML = i;
        let timer = null;
        let timeLeft = 300;

        btn.onclick = () => {
            if (btn.classList.contains('active')) {
                resetGroup(btn, i);
            } else {
                startGroup(btn, i);
            }
        };
        grid.appendChild(btn);
    }

    function startGroup(btn, num) {
        btn.classList.add('active');
        let timeLeft = 300;
        btn.timer = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            btn.innerHTML = `${num}<br><span>${mins}:${secs < 10 ? '0' : ''}${secs}</span>`;
            
            if (timeLeft <= 0) {
                clearInterval(btn.timer);
                speak(`Group ${num}, Group ${num}, Group ${num}`);
            }
        }, 1000);
    }

    function resetGroup(btn, num) {
        clearInterval(btn.timer);
        btn.classList.remove('active');
        btn.innerHTML = num;
    }

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(msg);
    }

    // Testing Window Logic
    function updateTestingWindow() {
        const now = new Date();
        const time = now.getHours() * 100 + now.getMinutes();
        const indicator = document.getElementById('test-indicator');
        
        // 8:10-8:30, 9:20-9:40, 9:50-10:10 (adjusted your typo 9:50-9:10 to 10:10)
        const isOpen = (time >= 810 && time <= 830) || (time >= 920 && time <= 940) || (time >= 950 && time <= 1010);
        
        indicator.style.backgroundColor = isOpen ? 'var(--green)' : 'var(--red)';
        indicator.innerText = isOpen ? "Testing Window Open" : "Testing Window Closed";

        // Auto PDF at 11:00 AM
        if (time === 1100 && now.getSeconds() === 0) {
            generatePDF();
        }
    }
    setInterval(updateTestingWindow, 1000);

    // Bathroom Logic
    let currentGender = '';
    function openTeacherSelect(gender) {
        if (bathroomState[gender].active) {
            resetBathroom(gender);
            return;
        }
        currentGender = gender;
        const modal = document.getElementById('modal-overlay');
        const content = document.getElementById('modal-content');
        modal.style.display = 'flex';
        content.innerHTML = `<h3>Select Teacher</h3>` + 
            Object.keys(students).map(t => `<div class="list-item" onclick="openStudentSelect('${t}')">${t}</div>`).join('');
    }

    function openStudentSelect(teacher) {
        const content = document.getElementById('modal-content');
        content.innerHTML = `<h3>Select Student (${teacher})</h3>` + 
            students[teacher].map(s => `<div class="list-item" onclick="selectStudent('${s}')">${s}</div>`).join('');
    }

    function selectStudent(name) {
        document.getElementById('modal-overlay').style.display = 'none';
        clickedStudents.add(name);
        const gender = currentGender;
        const btn = document.getElementById(`${gender}-btn`);
        
        bathroomState[gender].active = true;
        bathroomState[gender].timer = 0;
        btn.classList.add('occupied');
        
        bathroomState[gender].interval = setInterval(() => {
            bathroomState[gender].timer++;
            let m = Math.floor(bathroomState[gender].timer / 60);
            let s = bathroomState[gender].timer % 60;
            btn.innerHTML = `${name}<br>${m}:${s < 10 ? '0' : ''}${s}`;
        }, 1000);
    }

    function resetBathroom(gender) {
        clearInterval(bathroomState[gender].interval);
        bathroomState[gender].active = false;
        const btn = document.getElementById(`${gender}-btn`);
        btn.classList.remove('occupied');
        btn.innerHTML = gender.charAt(0).toUpperCase() + gender.slice(1);
    }

    function generatePDF() {
        const doc = new jsPDF();
        doc.text("Hallway Checkout Logs - 11:00 AM", 10, 10);
        let y = 20;
        clickedStudents.forEach(name => {
            doc.text(name, 10, y);
            y += 10;
        });
        doc.save("daily_checkout.pdf");
    }
</script>
</body>
</html>
