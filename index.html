<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Timer Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f9;
      height: 100vh;
      display: flex;
      padding: 10px;
      gap: 10px;
      overflow: hidden;
    }

    /* Layout Sections */
    .left-section {
      width: 75vw;
      height: calc(100vh - 20px);
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .right-section {
      width: 25vw;
      height: calc(100vh - 20px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .testing-section {
      height: 33.33%;
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .bathroom-section {
      height: 66.66%;
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
      color: #333;
    }

    /* Hallway Checkout Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      flex-grow: 1;
    }
